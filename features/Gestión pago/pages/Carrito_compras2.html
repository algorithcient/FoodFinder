<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFinder - Checkout Paso 2: Pago</title>
    <link rel="stylesheet" href="../../../styles.css">
</head>

<body>

    <header class="navbar">
        <div class="navbar-left">
            <a href="../../Navegación/pages/home.html">
                <img
                    src="../../../Assests/Icons/FF_Logo_Consu.png"
                    alt="FoodFinder Logo"
                    class="logo-completo-consumidor">
            </a>
        </div>

        <div class="navbar-center">
            <input
                type="text"
                placeholder="Busca desde el Home de FoodFinder"
                class="search-bar"
                id="buscadorCheckoutPago"
                readonly>
        </div>

        <div class="navbar-right">
            <a
                href="../../Gestion de pedido/Pages/detalles-cliente.html"
                class="btn-active-orders">
                Mis Pedidos
            </a>

            <div class="nav-icons">
                <a href="Carrito_compras1.html">
                    <img
                        src="../../../Assests/Icons/carrito.png"
                        alt="Carrito de compras"
                        class="icon">
                </a>

                <a href="../../Gestion de pedido/Pages/cuenta-cliente.html">
                    <img
                        src="../../../Assests/Icons/perfil.png"
                        alt="Perfil"
                        class="icon">
                </a>
            </div>
        </div>
    </header>

    <main class="main-container">

        <p class="breadcrumb">
            <a href="../../Navegación/pages/home.html">HOME</a>
            <span class="separator">—</span>
            <a href="Carrito_compras1.html">CHECKOUT</a>
            <span class="separator">—</span>
            PASO 2: PAGO
        </p>

        <div class="step-bar">
            <div class="step-item">
                <div class="step-number">1</div>
                <span class="step-label">Dirección y entrega</span>
            </div>

            <div class="step-divider"></div>

            <div class="step-item active">
                <div class="step-number">2</div>
                <span class="step-label">Pago</span>
            </div>
        </div>

        <div class="content-grid">

            <section class="payment-section">
                <h2 class="section-title">💳 Método de pago</h2>

                <div class="payment-options">
                    <label class="payment-option selected">
                        <input
                            type="radio"
                            name="payment"
                            value="card"
                            checked>

                        <div class="radio-custom"></div>
                        <span class="emoji">💳</span>
                        <span class="option-text">
                            Tarjeta de<br>crédito/débito
                        </span>
                    </label>

                    <label class="payment-option">
                        <input
                            type="radio"
                            name="payment"
                            value="cash">

                        <div class="radio-custom"></div>
                        <span class="emoji">💵</span>
                        <span class="option-text">
                            Efectivo<br>al delivery
                        </span>
                    </label>

                    <label class="payment-option">
                        <input
                            type="radio"
                            name="payment"
                            value="yape">

                        <div class="radio-custom"></div>
                        <span class="emoji">📱</span>
                        <span class="option-text">
                            Yape /<br>Plin
                        </span>
                    </label>

                    <label class="payment-option">
                        <input
                            type="radio"
                            name="payment"
                            value="transfer">

                        <div class="radio-custom"></div>
                        <span class="emoji">🏦</span>
                        <span class="option-text">
                            Transferencia
                        </span>
                    </label>
                </div>

                <div class="card-fields" id="camposTarjeta">
                    <div class="form-group">
                        <label for="numeroTarjeta">Número de tarjeta</label>
                        <input
                            type="text"
                            id="numeroTarjeta"
                            placeholder="0000 0000 0000 0000"
                            maxlength="19">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="vencimientoTarjeta">Vencimiento</label>
                            <input
                                type="text"
                                id="vencimientoTarjeta"
                                placeholder="MM/YY"
                                maxlength="5">
                        </div>

                        <div class="form-group">
                            <label for="cvvTarjeta">CVV</label>
                            <input
                                type="password"
                                id="cvvTarjeta"
                                placeholder="•••"
                                maxlength="4">
                        </div>
                    </div>
                </div>

                <div id="mensajeMetodoPago" class="card-fields" style="display: none;">
                    <p style="margin: 0; color: #555;">
                        Este método de pago será registrado para la demostración del pedido.
                    </p>
                </div>

                <div class="actions">
                    <button
                        type="button"
                        class="btn-secondary"
                        id="btnVolverCarrito">
                        ← Volver
                    </button>

                    <button
                        type="button"
                        class="btn-primary"
                        id="btn-confirmar-pedido">
                        Confirmar<br>pedido →
                    </button>
                </div>
            </section>

            <aside class="order-summary">
                <div class="summary-card">
                    <h3>Tu pedido</h3>

                    <div id="order-items" class="order-items">
                    </div>

                    <div class="summary-divider"></div>

                    <div class="summary-totals">
                        <div class="total-row">
                            <span>Subtotal</span>
                            <span>S/ 0.00</span>
                        </div>

                        <div class="total-row">
                            <span>Delivery</span>
                            <span>S/ 0.00</span>
                        </div>

                        <div class="total-row final">
                            <span>Total</span>
                            <span>S/ 0.00</span>
                        </div>
                    </div>
                </div>

                <div class="estimated-time">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M8.00016 14.6667C11.6821 14.6667 14.6668 11.6819 14.6668 8C14.6668 4.3181 11.6821 1.33333 8.00016 1.33333C4.31826 1.3335 1.3335 4.3181 1.3335 8C1.3335 11.6819 4.31826 14.6667 8.00016 14.6667Z" stroke="#555555" stroke-width="1.33333" stroke-linecap="round"/>
                        <path d="M8 4V8L10.6667 9.33333" stroke="#555555" stroke-width="1.33333" stroke-linecap="round"/>
                    </svg>

                    <span>
                        Tiempo estimado:
                        <strong>25-35 min</strong>
                    </span>
                </div>
            </aside>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/transacciones.js"></script>
    <script src="../js/paso2.js"></script>
</body>
</html>
